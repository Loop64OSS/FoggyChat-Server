[package]
name = "foggychat-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.47.0", features = ["full"] }
regex = "1.11.1"

aes-gcm = "0.10.3"
base64 = "0.22.1"



x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
sha2 = "0.10.9"
rand = "0.9.2"
lazy_static = "1.5.0"
blake3 = "1.8.2"
byteorder = "1.5.0"

[dependencies.uuid]
version = "1.17.0"
# Lets you generate random UUIDs
features = [
    "v4",
]
